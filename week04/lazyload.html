<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A demonstration of lazy loading images using HTML, CSS and JavaScript.">
    <meta name="author" content="Hossana Edem Okon">
    <title>Lazy Loading Images | WDD 131</title>

    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <header>
        <h1>Lazy Loading Images</h1>
    </header>

    <main>
        <h1>Beautiful Portrait Photography</h1>

        <img src="images/image1.jpg" alt="Portrait photograph one" width="400" height="600" loading="lazy">

        <img src="images/image2.jpg" alt="Portrait photograph two" width="400" height="600" loading="lazy">

        <img src="images/image3.jpg" alt="Portrait photograph three" width="400" height="600" loading="lazy">

        <img src="images/image4.jpg" alt="Portrait photograph four" width="400" height="600" loading="lazy">

        <img src="images/image5.jpg" alt="Portrait photograph five" width="400" height="600" loading="lazy">

        <img src="images/image6.jpg" alt="Portrait photograph six" width="400" height="600" loading="lazy">
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Hossana Edem Okon</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
