<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review and share your experience.">
    <meta name="author" content="Hossana Edem Okon">
    <title>Product Review Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating-options">
                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        ☆
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2">
                        ☆☆
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3">
                        ☆☆☆
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4">
                        ☆☆☆☆
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5">
                        ☆☆☆☆☆
                    </label>
                </div>
            </fieldset>

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Useful Features</legend>
                <p class="hint">Select all the features you found useful.</p>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="ease">
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>
            </fieldset>

            <label for="review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="review" name="review" rows="5" placeholder="Write your product experience here..."></textarea>

            <label for="username">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="username" name="username" placeholder="Enter your name">

            <input type="submit" value="Submit Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Product Review</p>
        <p>Hossana Edem Okon | WDD 131</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
