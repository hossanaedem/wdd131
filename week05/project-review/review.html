<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review submission confirmation.">
    <meta name="author" content="Hossana Edem Okon">
    <title>Review Submitted</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/review.js" defer></script>
</head>

<body>
    <header>
        <h1>Thank You!</h1>
    </header>

    <main>
        <section class="confirmation">
            <h2>Your Review Has Been Submitted</h2>

            <p>Thank you for taking the time to share your product experience.</p>

            <h3>Review Information</h3>
            <p>Product: <span id="productName"></span></p>
            <p>Rating: <span id="productRating"></span></p>

            <h3>Review Counter</h3>
            <p>You have completed <strong id="reviewCount">0</strong> reviews.</p>

            <a href="form.html" class="back-link">Submit Another Review</a>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Product Review</p>
        <p>Hossana Edem Okon | WDD 131</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
